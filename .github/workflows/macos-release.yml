name: Desktop installers
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-release:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: npm ci --no-audit --no-fund
      - name: Build and exercise native Keychain helper
        run: |
          xcrun swiftc -target arm64-apple-macos14.0 -O -framework Security platform/macos/Keychain.swift -o platform/macos/zhizhi-keychain
          codesign --force --sign - platform/macos/zhizhi-keychain
          TEST_KEYCHAIN_PASS="$(openssl rand -hex 24)"
          TEST_KEYCHAIN="$RUNNER_TEMP/zhizhi-test.keychain-db"
          security create-keychain -p "$TEST_KEYCHAIN_PASS" "$TEST_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TEST_KEYCHAIN"
          security unlock-keychain -p "$TEST_KEYCHAIN_PASS" "$TEST_KEYCHAIN"
          security list-keychains -d user -s "$TEST_KEYCHAIN"
          security default-keychain -d user -s "$TEST_KEYCHAIN"
          npm test
      - name: Build self-contained pkg
        run: bash scripts/build-macos.sh
      - name: Install, start bundled runtime, and test upgrade persistence
        run: node scripts/test-macos-package.mjs
      - run: npx playwright install chromium
      - name: Browser regressions on native ARM Chromium
        run: |
          npm run test:browser
          node tests/readability.mjs
          node tests/interaction-update.mjs
          node tests/regressions.mjs
          npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-validation
          path: |
            release/*
            test-results/*.json
            test-results/*.png
          if-no-files-found: warn
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - name: Browser regressions
        shell: pwsh
        run: |
          $env:CHROME_PATH = node -e "console.log(require('@playwright/test').chromium.executablePath())"
          npm run test:browser
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/readability.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/interaction-update.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/regressions.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Desktop window and connection regression
        run: npm run test:desktop
      - name: Build standalone Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install, upgrade, and uninstall with user data preserved
        run: node scripts/test-windows-package.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-validation
          path: |
            release/*
            test-results/*.json
            test-results/*.png
          if-no-files-found: warn
  publish:
    needs: [build-test-release, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-validation'
          merge-multiple: true
          path: artifacts
      - name: Publish both verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then TAG="testing"; fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Version and tag do not match' >&2; exit 1
          fi
          if [[ "$TAG" != testing ]] && gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Version already published; testing builds keep the existing app version.'; exit 0
          fi
          PKG="artifacts/release/Zhizhi-${VERSION}-macos-arm64.pkg"
          EXE="artifacts/release/Zhizhi-${VERSION}-windows-x64-setup.exe"
          test -s "$PKG" && test -s "$EXE"
          (cd artifacts/release && sha256sum *.pkg *.exe > SHA256SUMS.txt)
          cp artifacts/test-results/macos-install.json artifacts/Mac-validation.json
          cp artifacts/test-results/windows-install.json artifacts/Windows-validation.json
          cat > artifacts/notes.md <<'NOTES'
          ## 知枝 · Windows 与 Apple Silicon
          - Windows 10/11 x64：下载 `windows-x64-setup.exe`，双击安装，从开始菜单打开知枝。
          - macOS 14+、M 系列：下载 `macos-arm64.pkg`，安装后从“应用程序”打开 Zhizhi。
          - 两个平台均为独立桌面应用窗口，不再打开浏览器；安装包内置运行环境。
          - 未连接时右上角显示「连接到 Agent」，成功验证后显示已连接，失败时可直接重试。
          - 图谱保存在用户数据目录；API Key 由 Windows DPAPI / Mac 钥匙串保护。升级前退出知枝，新版本保留学习数据。
          - 设置中可检查更新，并下载对应系统安装包。
          - **未配置开发者代码签名：Windows 可能显示 SmartScreen，Mac 包未使用 Developer ID 签名与公证。** 请核对本仓库来源及 SHA256；不要关闭系统全局安全保护。
          - 发布前已在独立 Windows 与 ARM Mac runner 执行单元、浏览器、真实安装、启动和覆盖安装持久化测试。附件包含安装验证结果。真实 Mac/Windows 模型账号登录需用户在官方客户端完成。
          NOTES
          if [[ "$TAG" == testing ]]; then
            printf '\n测试版：版本号保持 %s。教材可选，支持批量文件导入和底部确认教材。\n构建提交：%s\n' "$VERSION" "$GITHUB_SHA" >> artifacts/notes.md
            if gh release view testing >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/testing" -f sha="$GITHUB_SHA" -F force=true
              gh release upload testing "$PKG" "$EXE" artifacts/release/SHA256SUMS.txt artifacts/Mac-validation.json artifacts/Windows-validation.json --clobber
              gh release edit testing --title "知枝 $VERSION · 测试版" --notes-file artifacts/notes.md --prerelease --latest=false
            else
              gh release create testing "$PKG" "$EXE" artifacts/release/SHA256SUMS.txt artifacts/Mac-validation.json artifacts/Windows-validation.json --target "$GITHUB_SHA" --title "知枝 $VERSION · 测试版" --notes-file artifacts/notes.md --prerelease --latest=false
            fi
          else
            gh release create "$TAG" "$PKG" "$EXE" artifacts/release/SHA256SUMS.txt artifacts/Mac-validation.json artifacts/Windows-validation.json --target "$GITHUB_SHA" --title "知枝 $VERSION · Windows / Apple Silicon" --notes-file artifacts/notes.md --latest
          fi
